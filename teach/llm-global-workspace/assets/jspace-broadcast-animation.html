<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全局工作空间 / J-space 动画演示</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #17132b;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.2rem 1rem;
}
h1 { font-size: 1.2rem; margin-bottom: 0.2rem; color:#e9d5ff; }
.subtitle { color: #9a8fc0; font-size: 0.78rem; margin-bottom: 0.9rem; }

.stage {
  width: 100%;
  aspect-ratio: 2 / 1;
  background: #0e0b1e;
  border-radius: 10px;
  border: 1px solid #332b52;
  position: relative;
  overflow: hidden;
}

.token {
  position: absolute;
  padding: 0.32em 0.62em;
  border-radius: 5px;
  font-size: clamp(0.5rem, 1.15vw, 0.78rem);
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: scale(0.85);
}
.token.visible { opacity: 1; transform: scale(1); }
.token.dim { opacity: 0.28; }
.token.prompt      { background: #334155; color: #e2e8f0; }
.token.specialist  { background: #3f3f5a; color: #c7c7e0; }
.token.concept     { background: #7c3aed; color: #fff; box-shadow: 0 0 14px rgba(168,85,247,0.7); }
.token.reader      { background: #0891b2; color: #fff; }
.token.answer      { background: #16a34a; color: #fff; }
.token.swapped     { background: #ea580c; color: #fff; }
.token.lens        { background: #0e7490; color: #cffafe; font-family: monospace; }
.token.info        { background: transparent; color: #8b83a8; font-weight: 500; font-size: clamp(0.46rem,1vw,0.68rem); }
.token.warn        { background: #b91c1c; color: #fff; }

.region {
  position: absolute;
  border-radius: 8px;
  border: 1px solid;
  transition: all 0.5s ease;
  opacity: 0;
}
.region.visible { opacity: 1; }
.region.dim { opacity: 0.3; }
.region.spec { border-color: #6366f1; background: rgba(99,102,241,0.06); }
.region.ws   { border-color: #a855f7; background: rgba(168,85,247,0.10); }
.region.read { border-color: #06b6d4; background: rgba(6,182,212,0.06); }

.region-label {
  position: absolute;
  font-size: clamp(0.44rem, 0.95vw, 0.62rem);
  color: #9a8fc0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.region-label.visible { opacity: 1; }

.arrow {
  position: absolute;
  transition: all 0.5s ease;
  opacity: 0;
  color: #a855f7;
  font-size: clamp(0.8rem, 1.6vw, 1.25rem);
  font-weight: 700;
}
.arrow.visible { opacity: 1; }

.desc {
  width: 100%;
  margin-top: 0.8rem;
  padding: 0.8rem 1rem;
  background: #1e1a38;
  border-radius: 8px;
  min-height: 64px;
  font-size: clamp(0.74rem, 1.35vw, 0.9rem);
  line-height: 1.6;
  color: #d6cef6;
}
.desc strong { color: #c4b5fd; }

.controls {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-top: 0.8rem;
  width: 100%;
}
.controls button {
  padding: 0.4rem 1.1rem;
  border: 1px solid #a855f7;
  background: transparent;
  color: #d8b4fe;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.controls button:hover:not(:disabled) { background: #a855f7; color: #0e0b1e; }
.controls button:disabled { opacity: 0.3; cursor: not-allowed; }
.controls .progress { color: #9a8fc0; font-size: 0.75rem; margin-left: auto; }
</style>
</head>
<body>

<h1>全局工作空间：写入一次，广播多用</h1>
<p class="subtitle">点击「下一步」推进：从并行专家 → 工作空间 → 广播 → 复用 → 读出</p>

<div class="stage" id="stage"></div>
<div class="desc" id="desc"></div>
<div class="controls">
  <button type="button" id="prevBtn">← 上一步</button>
  <button type="button" id="nextBtn">下一步 →</button>
  <span class="progress" id="progress"></span>
  <button type="button" id="resetBtn" style="border-color:#6b6488; color:#9a8fc0;">重置</button>
</div>

<script>
const stage = document.getElementById('stage');
const desc = document.getElementById('desc');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const progressEl = document.getElementById('progress');

let currentStep = -1;
const elements = {};

function el(id, cls, text, x, y) {
  const d = document.createElement('div');
  d.className = 'token ' + cls;
  d.textContent = text;
  d.style.left = x + '%';
  d.style.top = y + '%';
  stage.appendChild(d);
  elements[id] = d;
}
function region(id, cls, x, y, w, h, label) {
  const d = document.createElement('div');
  d.className = 'region ' + cls;
  d.style.left = x + '%'; d.style.top = y + '%';
  d.style.width = w + '%'; d.style.height = h + '%';
  stage.appendChild(d);
  elements[id] = d;
  if (label) {
    const lb = document.createElement('div');
    lb.className = 'region-label';
    lb.textContent = label;
    lb.style.left = x + '%'; lb.style.top = (y - 4.5) + '%';
    stage.appendChild(lb);
    elements[id + '_lbl'] = lb;
  }
}
function arrow(id, text, x, y) {
  const d = document.createElement('div');
  d.className = 'arrow';
  d.textContent = text;
  d.style.left = x + '%'; d.style.top = y + '%';
  stage.appendChild(d);
  elements[id] = d;
}
function show() { for (const id of arguments) { const e = elements[id]; if (e) e.classList.add('visible'); const l = elements[id+'_lbl']; if (l) l.classList.add('visible'); } }
function hide() { for (const id of arguments) { const e = elements[id]; if (e) e.classList.remove('visible'); const l = elements[id+'_lbl']; if (l) l.classList.remove('visible'); } }
function dim()  { for (const id of arguments) { const e = elements[id]; if (e) e.classList.add('dim'); } }
function undim(){ for (const id of arguments) { const e = elements[id]; if (e) e.classList.remove('dim'); } }
function restyle(id, cls) { if (elements[id]) elements[id].className = 'token ' + cls + ' visible'; }

function buildScene() {
  stage.innerHTML = '';
  for (const k in elements) delete elements[k];

  // Regions
  region('r-spec', 'spec', 1.5, 17, 26, 65, '并行专家 · 自动处理');
  region('r-ws',   'ws',   34, 35, 32, 23, 'J-SPACE 全局工作空间');
  region('r-read', 'read', 71, 17, 27.5, 65, '下游读取者');

  // Input prompt
  el('p0', 'prompt', '输入：会织网的动物有几条腿？', 1.5, 3);

  // Specialists (automatic processing)
  el('s1', 'specialist', '语法 / 句法', 3.5, 24);
  el('s2', 'specialist', '词义检索', 3.5, 37);
  el('s3', 'specialist', '指代消解', 3.5, 50);
  el('s4', 'specialist', '表层续写', 3.5, 63);
  el('s-note', 'info', '占全网络 >90% 激活', 3.5, 75);

  // Workspace content
  el('c-spider', 'concept', '🕷 spider', 37, 43);
  el('ws-note', 'info', '<10% 激活 · 容量 ≤ ~25 概念', 36, 50);

  // Write arrow (specialists -> workspace)
  arrow('a-write', '→', 29.5, 43);

  // Broadcast arrows (workspace -> readers, and back to network)
  arrow('a-bc1', '→', 67, 27);
  arrow('a-bc2', '→', 67, 41);
  arrow('a-bc3', '↘', 67, 55);
  arrow('a-back', '↩ 广播回全网', 34, 64);

  // Downstream readers
  el('rd1', 'reader', '腿数 →', 72.5, 25);
  el('ans1', 'answer', '8', 90, 25);
  el('rd2', 'reader', '分类 → 节肢动物', 72.5, 40);
  el('rd3', 'reader', '栖息 → 会织网', 72.5, 55);
  el('rd-note', 'info', '同一 spider，多任务复用', 72.5, 72);

  // Bypass / ablation (step 5)
  el('ablate', 'warn', '✂ 删除 J-space', 42, 36);
  el('bypass', 'info', '流利续写 ✓  语法 ✓  情感分类 ✓  （绕过工作空间）', 3.5, 88);
  el('reasondrop', 'warn', '多步推理 → ≈ 0', 3.5, 95);

  // J-lens readout + swap (step 6)
  el('lens1', 'lens', '1. spider', 34, 63);
  el('lens2', 'lens', '2. legs', 46, 63);
  el('lens3', 'lens', '3. eight', 55, 63);
  el('swap', 'swapped', 'swap: spider→ant  ⇒  答案 8→6', 34, 71);
}

const steps = [
  {
    action() { show('p0', 'r-spec', 's1', 's2', 's3', 's4', 's-note'); },
    desc: '<strong>Step 1 — 并行专家（自动处理）</strong>：输入进入模型，大量子网络<strong>并行、无意识</strong>地计算：语法、检索、指代、表层续写……这类自动处理占全网络 >90% 的激活，彼此大体隔离。'
  },
  {
    action() { show('r-ws', 'a-write', 'c-spider', 'ws-note'); },
    desc: '<strong>Step 2 — 写入工作空间</strong>：少数概念被写进一个狭窄的<strong>共享通道 = J-space</strong>。题目里从没出现 “spider”，但它在这里点亮——模型<strong>心里想到了蜘蛛</strong>。容量有限（约 ≤25 个概念，<10% 激活）。'
  },
  {
    action() { show('a-bc1', 'a-bc2', 'a-bc3', 'a-back'); },
    desc: '<strong>Step 3 — 广播</strong>：工作空间把内容向<strong>全网络广播</strong>。结构上，J-lens 向量被 MLP 放大约 <strong>10×</strong>、读写连接密度远高于普通方向——这正是一个“广播枢纽”应有的接线方式。'
  },
  {
    action() { show('r-read', 'rd1', 'ans1', 'rd2', 'rd3', 'rd-note'); },
    desc: '<strong>Step 4 — 写入一次，多处复用（灵活泛化）</strong>：同一份 “spider” 被多个下游模块读取，各自完成不同任务（数腿→8、分类、栖息）。写一次、多处用——这就是工作空间的意义。（论文里的 France→首都/语言/货币 是同一实验。）'
  },
  {
    action() { dim('r-ws'); restyle('c-spider','concept'); dim('c-spider'); hide('a-write','a-bc1','a-bc2','a-bc3','a-back'); show('ablate','bypass','reasondrop'); },
    desc: '<strong>Step 5 — 大部分能力绕过工作空间</strong>：删掉 J-space 后，流利说话、语法、情感分类、事实召回<strong>照常</strong>；但<strong>多步推理掉到≈0</strong>，摘要/写诗也大幅下降。工作空间只管“高阶、灵活”的认知。'
  },
  {
    action() { undim('r-ws','c-spider'); hide('ablate','bypass','reasondrop'); show('lens1','lens2','lens3','swap'); },
    desc: '<strong>Step 6 — 用 J-lens 读出，并证明因果</strong>：J-lens 把工作空间内容读成一个<strong>排序词表</strong>（spider, legs, eight），于是我们能看见沉默的思考。把 “spider” 换成 “ant”，下游答案从 8 变 6——它是<strong>因果读出</strong>，不是被动的记分牌。'
  },
];

function applyStep(idx) {
  buildScene();
  for (let i = 0; i <= idx; i++) steps[i].action();
  desc.innerHTML = steps[idx].desc;
  progressEl.textContent = (idx + 1) + ' / ' + steps.length;
  prevBtn.disabled = idx <= 0;
  nextBtn.disabled = idx >= steps.length - 1;
}
function reset() {
  currentStep = -1;
  buildScene();
  desc.innerHTML = '点击「下一步」开始动画演示。';
  progressEl.textContent = '0 / ' + steps.length;
  prevBtn.disabled = true;
  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', () => { if (currentStep < steps.length - 1) { currentStep++; applyStep(currentStep); } });
prevBtn.addEventListener('click', () => { if (currentStep > 0) { currentStep--; applyStep(currentStep); } });
resetBtn.addEventListener('click', reset);
reset();
</script>
</body>
</html>
