<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSpark 算法动画演示</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1rem;
}
h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
.subtitle { color: #8892b0; font-size: 0.8rem; margin-bottom: 1rem; }

.stage {
  width: 100%;
  aspect-ratio: 2.2 / 1;
  background: #0f0f23;
  border-radius: 10px;
  border: 1px solid #333;
  position: relative;
  overflow: hidden;
}

.token {
  position: absolute;
  padding: 0.35em 0.7em;
  border-radius: 5px;
  font-size: clamp(0.55rem, 1.2vw, 0.8rem);
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: scale(0.8);
}
.token.visible { opacity: 1; transform: scale(1); }
.token.anchor { background: #16a34a; color: white; }
.token.mask { background: #475569; color: #94a3b8; border: 1px dashed #64748b; }
.token.logit { background: #2563eb; color: white; }
.token.bias { background: #d97706; color: white; }
.token.draft { background: #7c3aed; color: white; }
.token.conf { background: #dc2626; color: white; }
.token.accepted { background: #16a34a; color: white; }
.token.rejected { background: #dc2626; color: white; text-decoration: line-through; }
.token.bonus { background: #eab308; color: #1a1a2e; }

.region {
  position: absolute;
  border-radius: 7px;
  border: 1px solid;
  transition: all 0.5s ease;
  opacity: 0;
}
.region.visible { opacity: 1; }
.region.backbone { border-color: #d97706; background: rgba(217,119,6,0.08); }
.region.seqhead { border-color: #7c3aed; background: rgba(124,58,237,0.08); }
.region.target { border-color: #16a34a; background: rgba(22,163,74,0.08); }

.region-label {
  position: absolute;
  font-size: clamp(0.5rem, 1vw, 0.65rem);
  color: #8892b0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.desc {
  width: 100%;
  margin-top: 0.8rem;
  padding: 0.8rem 1rem;
  background: #16213e;
  border-radius: 8px;
  min-height: 60px;
  font-size: clamp(0.75rem, 1.4vw, 0.9rem);
  line-height: 1.6;
  color: #ccd6f6;
}
.desc strong { color: #64ffda; }

.controls {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-top: 0.8rem;
  width: 100%;
}
.controls button {
  padding: 0.4rem 1.2rem;
  border: 1px solid #64ffda;
  background: transparent;
  color: #64ffda;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.controls button:hover:not(:disabled) { background: #64ffda; color: #0f0f23; }
.controls button:disabled { opacity: 0.3; cursor: not-allowed; }
.controls .progress { color: #8892b0; font-size: 0.75rem; margin-left: auto; }
</style>
</head>
<body>

<h1>DSpark: 一轮 Speculative Decoding</h1>
<p class="subtitle">点击「下一步」推进算法流程</p>

<div class="stage" id="stage"></div>
<div class="desc" id="desc"></div>
<div class="controls">
  <button type="button" id="prevBtn">← 上一步</button>
  <button type="button" id="nextBtn">下一步 →</button>
  <span class="progress" id="progress"></span>
  <button type="button" id="resetBtn" style="border-color:#8892b0; color:#8892b0;">重置</button>
</div>

<script>
const stage = document.getElementById('stage');
const desc = document.getElementById('desc');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const progress = document.getElementById('progress');

let currentStep = -1;
const elements = {};

// All positions in percentages for responsive layout
function el(id, cls, text, xPct, yPct) {
  const d = document.createElement('div');
  d.className = 'token ' + cls;
  d.textContent = text;
  d.style.left = xPct + '%';
  d.style.top = yPct + '%';
  stage.appendChild(d);
  elements[id] = d;
}
function region(id, cls, xPct, yPct, wPct, hPct, label) {
  const d = document.createElement('div');
  d.className = 'region ' + cls;
  d.style.left = xPct + '%';
  d.style.top = yPct + '%';
  d.style.width = wPct + '%';
  d.style.height = hPct + '%';
  stage.appendChild(d);
  elements[id] = d;
  if (label) {
    const lb = document.createElement('div');
    lb.className = 'region-label';
    lb.textContent = label;
    lb.style.left = xPct + '%';
    lb.style.top = (yPct - 5) + '%';
    stage.appendChild(lb);
  }
}
function show() { for (let i = 0; i < arguments.length; i++) { const e = elements[arguments[i]]; if (e) e.classList.add('visible'); } }
function hide() { for (let i = 0; i < arguments.length; i++) { const e = elements[arguments[i]]; if (e) e.classList.remove('visible'); } }
function restyle(id, cls) { if (elements[id]) elements[id].className = 'token ' + cls + ' visible'; }
function setText(id, t) { if (elements[id]) elements[id].textContent = t; }

function buildScene() {
  stage.innerHTML = '';
  for (const k in elements) delete elements[k];

  // Regions (x%, y%, w%, h%)
  region('r-backbone', 'backbone', 2, 22, 60, 28, 'PARALLEL BACKBONE (DFlash, 5 layers)');
  region('r-seqhead', 'seqhead', 2, 58, 60, 25, 'SEQUENTIAL HEAD (Markov)');
  region('r-target', 'target', 66, 22, 32, 61, 'TARGET MODEL');

  // Anchor
  el('anchor', 'anchor', 'x₀ = "The"', 4, 8);

  // Mask inputs
  el('m1', 'mask', 'MASK', 12, 32);
  el('m2', 'mask', 'MASK', 25, 32);
  el('m3', 'mask', 'MASK', 38, 32);
  el('m4', 'mask', 'MASK', 51, 32);

  // Base logits
  el('u1', 'logit', 'U₁', 12, 42);
  el('u2', 'logit', 'U₂', 25, 42);
  el('u3', 'logit', 'U₃', 38, 42);
  el('u4', 'logit', 'U₄', 51, 42);

  // Bias
  el('b1', 'bias', 'B₁(x₀)', 12, 63);
  el('b2', 'bias', 'B₂(x₁)', 25, 63);
  el('b3', 'bias', 'B₃(x₂)', 38, 63);
  el('b4', 'bias', 'B₄(x₃)', 51, 63);

  // Draft tokens
  el('x1', 'draft', 'x₁="cat"', 12, 76);
  el('x2', 'draft', 'x₂="sat"', 25, 76);
  el('x3', 'draft', 'x₃="on"', 38, 76);
  el('x4', 'draft', 'x₄="my"', 51, 76);

  // Confidence
  el('c1', 'conf', 'c₁=0.95', 12, 88);
  el('c2', 'conf', 'c₂=0.88', 25, 88);
  el('c3', 'conf', 'c₃=0.72', 38, 88);
  el('c4', 'conf', 'c₄=0.35', 51, 88);

  // Target results
  el('v1', 'accepted', '✓ x₁', 70, 35);
  el('v2', 'accepted', '✓ x₂', 80, 35);
  el('v3', 'accepted', '✓ x₃', 90, 35);
  el('v4', 'rejected', '✗ x₃', 90, 35);
  el('bonus', 'bonus', 'bonus="a"', 78, 55);

  // Scheduler
  el('keep', 'accepted', '保留: x₁ x₂ x₃', 70, 70);
  el('drop', 'rejected', '丢弃: x₄', 88, 70);
}

const steps = [
  {
    action() { show('anchor'); },
    desc: '<strong>Step 1 — Anchor Token</strong>：上一轮 target verification 产生 bonus token x₀="The"，作为本轮 draft 起点。'
  },
  {
    action() { show('r-backbone', 'm1', 'm2', 'm3', 'm4'); },
    desc: '<strong>Step 2 — 构造输入</strong>：anchor embedding + γ=4 个 MASK embedding 送入 parallel backbone。同时注入 target model 中间层的 context features。'
  },
  {
    action() { show('u1', 'u2', 'u3', 'u4'); hide('m1', 'm2', 'm3', 'm4'); },
    desc: '<strong>Step 3 — Parallel 前传完成</strong>：一次前向传播计算出所有位置的 base logits U₁~U₄ 和 hidden states。<strong>O(1) 延迟</strong>，不依赖采样。'
  },
  {
    action() { show('r-seqhead', 'b1'); },
    desc: '<strong>Step 4 — Sequential Head 启动</strong>：用 anchor x₀ 查 W₁ embedding，乘 W₂ 得到 bias B₁。logit = U₁ + B₁ → softmax → sample。'
  },
  {
    action() { show('x1', 'b2'); },
    desc: '<strong>Step 5 — 采样 x₁</strong>：softmax(U₁+B₁) → x₁="cat"。用 x₁ 计算 B₂(x₁) = W₁["cat"]·W₂。'
  },
  {
    action() { show('x2', 'b3'); },
    desc: '<strong>Step 6 — 采样 x₂</strong>：softmax(U₂+B₂) → x₂="sat"。B₂ 知道前面是 "cat"，提升了 "sat" 的概率。继续算 B₃。'
  },
  {
    action() { show('x3', 'x4', 'b4'); },
    desc: '<strong>Step 7 — 完成 block</strong>：逐步得到 x₃="on"、x₄="my"。Sequential loop 总共 4 次 lookup + matmul(256×V)，耗时 &lt;1% of backbone。'
  },
  {
    action() { show('c1', 'c2', 'c3', 'c4'); },
    desc: '<strong>Step 8 — Confidence 评分</strong>：预测条件 acceptance prob。c₄=0.35 很低。Prefix survival: a₃=0.95×0.88×0.72=0.60, a₄=0.21。'
  },
  {
    action() { show('keep', 'drop'); restyle('x4', 'rejected'); setText('x4', '✗ x₄'); },
    desc: '<strong>Step 9 — Scheduler 裁剪</strong>：Θ=τ·SPS(B) 最大化。保留 x₁x₂x₃（正收益），丢弃 x₄（浪费 batch capacity）。'
  },
  {
    action() { show('r-target', 'v1', 'v2'); hide('keep', 'drop'); },
    desc: '<strong>Step 10 — Target 验证</strong>：一次前传验证保留的 prefix。x₁ ✓ accepted, x₂ ✓ accepted...'
  },
  {
    action() { hide('v3'); show('v4', 'bonus'); },
    desc: '<strong>Step 11 — Rejection + Bonus</strong>：x₃ 被 reject。Target 从修正分布采样 bonus="a"。本轮 τ=3。bonus 成为下轮 anchor。'
  },
];

function applyStep(idx) {
  buildScene();
  for (let i = 0; i <= idx; i++) steps[i].action();
  desc.innerHTML = steps[idx].desc;
  progress.textContent = (idx + 1) + ' / ' + steps.length;
  prevBtn.disabled = idx <= 0;
  nextBtn.disabled = idx >= steps.length - 1;
}
function reset() {
  currentStep = -1;
  buildScene();
  desc.innerHTML = '点击「下一步」开始动画演示。';
  progress.textContent = '0 / ' + steps.length;
  prevBtn.disabled = true;
  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', () => { if (currentStep < steps.length - 1) { currentStep++; applyStep(currentStep); } });
prevBtn.addEventListener('click', () => { if (currentStep > 0) { currentStep--; applyStep(currentStep); } });
resetBtn.addEventListener('click', reset);
reset();
</script>
</body>
</html>
