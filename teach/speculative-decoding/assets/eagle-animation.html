<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAGLE 算法动画演示</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1rem;
}
h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
.subtitle { color: #8892b0; font-size: 0.8rem; margin-bottom: 1rem; }

.stage {
  width: 100%;
  aspect-ratio: 2.2 / 1;
  background: #0f0f23;
  border-radius: 10px;
  border: 1px solid #333;
  position: relative;
  overflow: hidden;
}

.token {
  position: absolute;
  padding: 0.35em 0.7em;
  border-radius: 5px;
  font-size: clamp(0.55rem, 1.2vw, 0.8rem);
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: scale(0.8);
}
.token.visible { opacity: 1; transform: scale(1); }
.token.feature { background: #16a34a; color: white; }
.token.embed { background: #7c3aed; color: white; }
.token.fuse { background: #d97706; color: white; }
.token.draft { background: #2563eb; color: white; }
.token.lmhead { background: #0891b2; color: white; }
.token.sample { background: #7c3aed; color: white; }
.token.accepted { background: #16a34a; color: white; }
.token.rejected { background: #dc2626; color: white; text-decoration: line-through; }
.token.bonus { background: #eab308; color: #1a1a2e; }
.token.error { background: #dc2626; color: white; }
.token.info { background: #475569; color: #94a3b8; }

.region {
  position: absolute;
  border-radius: 7px;
  border: 1px solid;
  transition: all 0.5s ease;
  opacity: 0;
}
.region.visible { opacity: 1; }
.region.fusion { border-color: #d97706; background: rgba(217,119,6,0.08); }
.region.decoder { border-color: #2563eb; background: rgba(37,99,235,0.08); }
.region.verify { border-color: #16a34a; background: rgba(22,163,74,0.08); }

.region-label {
  position: absolute;
  font-size: clamp(0.5rem, 1vw, 0.65rem);
  color: #8892b0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.arrow {
  position: absolute;
  transition: all 0.5s ease;
  opacity: 0;
  color: #64748b;
  font-size: clamp(0.8rem, 1.5vw, 1.2rem);
}
.arrow.visible { opacity: 1; }

.desc {
  width: 100%;
  margin-top: 0.8rem;
  padding: 0.8rem 1rem;
  background: #16213e;
  border-radius: 8px;
  min-height: 60px;
  font-size: clamp(0.75rem, 1.4vw, 0.9rem);
  line-height: 1.6;
  color: #ccd6f6;
}
.desc strong { color: #64ffda; }

.controls {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-top: 0.8rem;
  width: 100%;
}
.controls button {
  padding: 0.4rem 1.2rem;
  border: 1px solid #64ffda;
  background: transparent;
  color: #64ffda;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.controls button:hover:not(:disabled) { background: #64ffda; color: #0f0f23; }
.controls button:disabled { opacity: 0.3; cursor: not-allowed; }
.controls .progress { color: #8892b0; font-size: 0.75rem; margin-left: auto; }
</style>
</head>
<body>

<h1>EAGLE: Feature-Level Autoregressive Draft</h1>
<p class="subtitle">点击「下一步」推进算法流程</p>

<div class="stage" id="stage"></div>
<div class="desc" id="desc"></div>
<div class="controls">
  <button type="button" id="prevBtn">← 上一步</button>
  <button type="button" id="nextBtn">下一步 →</button>
  <span class="progress" id="progress"></span>
  <button type="button" id="resetBtn" style="border-color:#8892b0; color:#8892b0;">重置</button>
</div>

<script>
const stage = document.getElementById('stage');
const desc = document.getElementById('desc');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const progressEl = document.getElementById('progress');

let currentStep = -1;
const elements = {};

function el(id, cls, text, x, y) {
  const d = document.createElement('div');
  d.className = 'token ' + cls;
  d.textContent = text;
  d.style.left = x + '%';
  d.style.top = y + '%';
  stage.appendChild(d);
  elements[id] = d;
}
function region(id, cls, x, y, w, h, label) {
  const d = document.createElement('div');
  d.className = 'region ' + cls;
  d.style.left = x + '%'; d.style.top = y + '%';
  d.style.width = w + '%'; d.style.height = h + '%';
  stage.appendChild(d);
  elements[id] = d;
  if (label) {
    const lb = document.createElement('div');
    lb.className = 'region-label';
    lb.textContent = label;
    lb.style.left = x + '%'; lb.style.top = (y - 5) + '%';
    stage.appendChild(lb);
    elements[id + '_lbl'] = lb;
  }
}
function arrow(id, text, x, y) {
  const d = document.createElement('div');
  d.className = 'arrow';
  d.textContent = text;
  d.style.left = x + '%'; d.style.top = y + '%';
  stage.appendChild(d);
  elements[id] = d;
}
function show() { for (const id of arguments) { const e = elements[id]; if (e) e.classList.add('visible'); } }
function hide() { for (const id of arguments) { const e = elements[id]; if (e) e.classList.remove('visible'); } }
function restyle(id, cls) { if (elements[id]) elements[id].className = 'token ' + cls + ' visible'; }

function buildScene() {
  stage.innerHTML = '';
  for (const k in elements) delete elements[k];

  // Regions
  region('r-fusion', 'fusion', 2, 18, 30, 30, 'FUSION LAYER');
  region('r-decoder', 'decoder', 2, 55, 58, 25, 'DRAFT DECODER (1-layer Transformer)');
  region('r-verify', 'verify', 65, 18, 33, 62, 'TARGET VERIFICATION');

  // Step 1: anchor
  el('f0', 'feature', 'f₀ (target hidden)', 4, 5);
  el('x0', 'embed', 'e(x₀) embedding', 30, 5);

  // Step 2: fusion
  el('h0', 'fuse', 'h₀ = Fuse(f₀, e(x₀))', 5, 30);
  arrow('a-fuse1', '↓', 12, 14);
  arrow('a-fuse2', '↙', 35, 14);

  // Step 3: decoder → f̂₁
  el('fhat1', 'draft', 'f̂₁ (predicted)', 5, 65);
  arrow('a-dec1', '↓', 12, 46);

  // Step 4: LM head → sample x̂₁
  el('lm1', 'lmhead', 'LM Head (shared)', 30, 65);
  el('xhat1', 'sample', 'x̂₁ ~ p_d₁', 50, 65);
  arrow('a-lm1', '→', 24, 68);
  arrow('a-lm2', '→', 48, 68);

  // Step 5: recurse — h₁ → f̂₂ → x̂₂
  el('h1', 'fuse', 'h₁ = Fuse(f̂₁, e(x̂₁))', 5, 30);
  el('fhat2', 'draft', 'f̂₂ (误差累积)', 5, 65);
  el('xhat2', 'sample', 'x̂₂ ~ p_d₂', 50, 65);

  // Step 6: full block
  el('blk1', 'sample', 'x̂₁', 5, 83);
  el('blk2', 'sample', 'x̂₂', 18, 83);
  el('blk3', 'sample', 'x̂₃', 31, 83);
  el('blk4', 'sample', 'x̂₄', 44, 83);
  el('serial', 'info', 'T_draft = 4 × T_step (串行)', 5, 93);

  // Step 7: verification
  el('v1', 'accepted', '✓ x̂₁', 69, 28);
  el('v2', 'accepted', '✓ x̂₂', 81, 28);
  el('v3', 'accepted', '✓ x̂₃', 69, 45);
  el('v4', 'rejected', '✗ x̂₄', 81, 45);
  el('bonus', 'bonus', 'bonus: x₄ ~ norm(p_t-p_d)', 69, 62);

  // Step 8: result
  el('result', 'accepted', 'τ = 4 (accepted 3 + resample 1)', 67, 75);
}

const steps = [
  {
    action() { show('f0', 'x0'); },
    desc: '<strong>Step 1 — 初始状态</strong>：Target model 已确认 anchor x₀。我们拿到它的 <strong>真实 hidden state f₀</strong>（最后一层）和 token embedding e(x₀)。'
  },
  {
    action() { show('r-fusion', 'a-fuse1', 'a-fuse2', 'h0'); hide('h1'); },
    desc: '<strong>Step 2 — Fusion</strong>：concat(f₀, e(x₀)) 经 Linear 投影 → h₀。这把「hidden state 编码的分布」和「实际采样了哪个 token」融合在一起。'
  },
  {
    action() { show('r-decoder', 'a-dec1', 'fhat1'); hide('fhat2'); },
    desc: '<strong>Step 3 — Draft Decoder</strong>：1 层 Transformer 对 h₀ 做 self-attention → 预测下一步 feature f̂₁。KV cache 初始化。'
  },
  {
    action() { show('lm1', 'a-lm1', 'a-lm2', 'xhat1'); hide('xhat2'); },
    desc: '<strong>Step 4 — LM Head 采样</strong>：<strong>共享的</strong> target LM head 把 f̂₁ → logits → softmax → sample x̂₁。无额外参数。'
  },
  {
    action() { hide('h0', 'fhat1', 'xhat1', 'lm1', 'a-dec1', 'a-lm1', 'a-lm2', 'a-fuse1', 'a-fuse2'); show('h1', 'fhat2', 'xhat2'); },
    desc: '<strong>Step 5 — 递推 (误差累积)</strong>：用 <strong>预测的</strong> f̂₁ + e(x̂₁) 做 Fusion → h₁ → Decoder → f̂₂ → x̂₂。从此步开始 feature 不是真值，误差逐步放大。'
  },
  {
    action() { hide('h1', 'fhat2', 'xhat2', 'r-fusion', 'r-decoder'); show('blk1', 'blk2', 'blk3', 'blk4', 'serial'); },
    desc: '<strong>Step 6 — 完成 γ=4 block</strong>：重复递推 4 步，得到 draft 序列。<strong>总延迟 = 4 × T_step</strong>（autoregressive 串行瓶颈）。'
  },
  {
    action() { show('r-verify', 'v1', 'v2', 'v3', 'v4'); },
    desc: '<strong>Step 7 — Target Verification</strong>：Target 一次前传验证全部 draft token。逐位置 rejection sampling：accept prob = min(1, p_t/p_d)。这里前 3 个通过，x̂₄ 被拒。'
  },
  {
    action() { show('bonus', 'result'); },
    desc: '<strong>Step 8 — Bonus + 本轮产出</strong>：x̂₄ 被拒 → 从修正分布 norm(max(0, p_t−p_d)) 重采样 x₄。本轮 τ=4。x₄ 成为下轮 anchor，用其真实 f₄ 启动新一轮 draft。'
  },
];

function applyStep(idx) {
  buildScene();
  for (let i = 0; i <= idx; i++) steps[i].action();
  desc.innerHTML = steps[idx].desc;
  progressEl.textContent = (idx + 1) + ' / ' + steps.length;
  prevBtn.disabled = idx <= 0;
  nextBtn.disabled = idx >= steps.length - 1;
}
function reset() {
  currentStep = -1;
  buildScene();
  desc.innerHTML = '点击「下一步」开始动画演示。';
  progressEl.textContent = '0 / ' + steps.length;
  prevBtn.disabled = true;
  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', () => { if (currentStep < steps.length - 1) { currentStep++; applyStep(currentStep); } });
prevBtn.addEventListener('click', () => { if (currentStep > 0) { currentStep--; applyStep(currentStep); } });
resetBtn.addEventListener('click', reset);
reset();
</script>
</body>
</html>
