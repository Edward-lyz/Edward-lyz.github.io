<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAGLE2 算法动画演示</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1rem;
}
h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
.subtitle { color: #8892b0; font-size: 0.8rem; margin-bottom: 1rem; }

.stage {
  width: 100%;
  aspect-ratio: 2.2 / 1;
  background: #0f0f23;
  border-radius: 10px;
  border: 1px solid #333;
  position: relative;
  overflow: hidden;
}

.token {
  position: absolute;
  padding: 0.35em 0.7em;
  border-radius: 5px;
  font-size: clamp(0.55rem, 1.2vw, 0.8rem);
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: scale(0.8);
}
.token.visible { opacity: 1; transform: scale(1); }
.token.anchor { background: #16a34a; color: white; }
.token.high { background: #16a34a; color: white; }
.token.mid { background: #d97706; color: white; }
.token.low { background: #dc2626; color: white; }
.token.info { background: #475569; color: #94a3b8; }
.token.accepted { background: #16a34a; color: white; }
.token.rejected { background: #dc2626; color: white; text-decoration: line-through; }
.token.bonus { background: #eab308; color: #1a1a2e; }
.token.path { background: #2563eb; color: white; }
.token.expand { background: #7c3aed; color: white; }

.region {
  position: absolute;
  border-radius: 7px;
  border: 1px solid;
  transition: all 0.5s ease;
  opacity: 0;
}
.region.visible { opacity: 1; }
.region.tree { border-color: #7c3aed; background: rgba(124,58,237,0.06); }
.region.verify { border-color: #16a34a; background: rgba(22,163,74,0.06); }

.region-label {
  position: absolute;
  font-size: clamp(0.5rem, 1vw, 0.65rem);
  color: #8892b0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Tree lines */
.line {
  position: absolute;
  height: 2px;
  background: #4a5568;
  transform-origin: left center;
  transition: all 0.5s ease;
  opacity: 0;
}
.line.visible { opacity: 1; }
.line.highlight { background: #64ffda; height: 3px; }

.desc {
  width: 100%;
  margin-top: 0.8rem;
  padding: 0.8rem 1rem;
  background: #16213e;
  border-radius: 8px;
  min-height: 60px;
  font-size: clamp(0.75rem, 1.4vw, 0.9rem);
  line-height: 1.6;
  color: #ccd6f6;
}
.desc strong { color: #64ffda; }

.controls {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-top: 0.8rem;
  width: 100%;
}
.controls button {
  padding: 0.4rem 1.2rem;
  border: 1px solid #64ffda;
  background: transparent;
  color: #64ffda;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.controls button:hover:not(:disabled) { background: #64ffda; color: #0f0f23; }
.controls button:disabled { opacity: 0.3; cursor: not-allowed; }
.controls .progress { color: #8892b0; font-size: 0.75rem; margin-left: auto; }
</style>
</head>
<body>

<h1>EAGLE2: Dynamic Tree Draft + Verification</h1>
<p class="subtitle">点击「下一步」推进算法流程</p>

<div class="stage" id="stage"></div>
<div class="desc" id="desc"></div>
<div class="controls">
  <button type="button" id="prevBtn">← 上一步</button>
  <button type="button" id="nextBtn">下一步 →</button>
  <span class="progress" id="progress"></span>
  <button type="button" id="resetBtn" style="border-color:#8892b0; color:#8892b0;">重置</button>
</div>

<script>
const stage = document.getElementById('stage');
const desc = document.getElementById('desc');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const progressEl = document.getElementById('progress');

let currentStep = -1;
const elements = {};

function el(id, cls, text, x, y) {
  const d = document.createElement('div');
  d.className = 'token ' + cls;
  d.textContent = text;
  d.style.left = x + '%'; d.style.top = y + '%';
  stage.appendChild(d);
  elements[id] = d;
}
function region(id, cls, x, y, w, h, label) {
  const d = document.createElement('div');
  d.className = 'region ' + cls;
  d.style.left = x + '%'; d.style.top = y + '%';
  d.style.width = w + '%'; d.style.height = h + '%';
  stage.appendChild(d);
  elements[id] = d;
  if (label) {
    const lb = document.createElement('div');
    lb.className = 'region-label';
    lb.textContent = label;
    lb.style.left = x + '%'; lb.style.top = (y - 5) + '%';
    stage.appendChild(lb);
  }
}
function show() { for (const id of arguments) { const e = elements[id]; if (e) e.classList.add('visible'); } }
function hide() { for (const id of arguments) { const e = elements[id]; if (e) e.classList.remove('visible'); } }
function restyle(id, cls) { if (elements[id]) elements[id].className = 'token ' + cls + ' visible'; }

function buildScene() {
  stage.innerHTML = '';
  for (const k in elements) delete elements[k];

  region('r-tree', 'tree', 2, 10, 58, 82, 'DYNAMIC TREE DRAFT');
  region('r-verify', 'verify', 64, 10, 34, 82, 'TREE VERIFICATION');

  // Tree nodes
  el('root', 'anchor', 'x₀ (anchor)', 24, 8);

  // Depth 1: top-3
  el('a', 'high', 'a (p=0.60)', 5, 28);
  el('b', 'mid', 'b (p=0.25)', 22, 28);
  el('c', 'low', 'c (p=0.10)', 40, 28);

  // Depth 2: children of a
  el('d', 'high', 'd (conf=0.42)', 2, 50);
  el('e', 'mid', 'e (conf=0.18)', 20, 50);

  // Depth 2: child of b
  el('g', 'mid', 'g (conf=0.15)', 38, 50);

  // Depth 3: child of d
  el('f', 'high', 'f (conf=0.29)', 2, 72);

  // Budget info
  el('budget', 'info', 'Budget B=7 reached', 20, 88);

  // Confidence ranking
  el('rank', 'expand', '展开顺序: a→d→b→f→g', 5, 93);

  // Verification results
  el('va', 'accepted', '✓ a', 68, 20);
  el('vb', 'accepted', '✓ b', 84, 20);
  el('vc', 'rejected', '✗ c', 68, 36);
  el('vd', 'accepted', '✓ d', 84, 36);
  el('ve', 'rejected', '✗ e', 68, 52);
  el('vf', 'rejected', '✗ f', 84, 52);
  el('vg', 'rejected', '✗ g', 68, 68);

  // Result
  el('best', 'path', '最长路径: x₀→a→d (τ=3)', 67, 80);
  el('gain', 'bonus', 'chain 只能得 τ=2, tree 多赚 1', 67, 92);
}

const steps = [
  {
    action() { show('root'); },
    desc: '<strong>Step 1 — Anchor</strong>：从上一轮 bonus token x₀ 开始。对 x₀ 做一步 draft model 前传，得到 depth-1 候选分布。'
  },
  {
    action() { show('r-tree', 'a', 'b', 'c'); },
    desc: '<strong>Step 2 — Top-k 展开</strong>：取 draft distribution 的 top-3 作为 depth-1 节点。携带 draft 概率 p_d（颜色编码 confidence：<span style="color:#4ade80">绿=高</span> / <span style="color:#fbbf24">黄=中</span> / <span style="color:#f87171">红=低</span>）。'
  },
  {
    action() { show('d', 'e'); },
    desc: '<strong>Step 3 — 展开 a</strong>：path_conf(a)=0.60 最高。对 a 做一步 draft → children d, e。d 的 path_conf = 0.60×0.70 = 0.42。'
  },
  {
    action() { show('f'); },
    desc: '<strong>Step 4 — 展开 d</strong>：当前叶节点 conf 排序：d(0.42) > b(0.25) > e(0.18)。展开 d → child f (conf=0.29)。'
  },
  {
    action() { show('g', 'budget', 'rank'); },
    desc: '<strong>Step 5 — 继续展开至 budget</strong>：b(0.25) > f(0.29)... 展开 b → child g。到达 budget B=7，停止。<strong>树的形状自动适配了 context 难度</strong>：高置信方向（a→d→f）更深。'
  },
  {
    action() { show('r-verify', 'va', 'vb', 'vc', 'vd', 've', 'vf', 'vg'); },
    desc: '<strong>Step 6 — Tree Verification</strong>：Target 一次前传，用 <strong>tree attention mask</strong>（每个节点只 attend to 祖先 + context）。等价于对每条 root→leaf 路径独立做 rejection sampling。'
  },
  {
    action() { show('best', 'gain'); },
    desc: '<strong>Step 7 — 选最长路径</strong>：路径 acceptance：x₀→a→d→(f rejected)=2 个；x₀→b→(g rejected)=1 个；x₀→(c rejected)=0。取 <strong>max</strong> → τ_tree=3（含 bonus）。Chain 只有 1 条路径，tree 取 max 一定更好。'
  },
];

function applyStep(idx) {
  buildScene();
  for (let i = 0; i <= idx; i++) steps[i].action();
  desc.innerHTML = steps[idx].desc;
  progressEl.textContent = (idx + 1) + ' / ' + steps.length;
  prevBtn.disabled = idx <= 0;
  nextBtn.disabled = idx >= steps.length - 1;
}
function reset() {
  currentStep = -1;
  buildScene();
  desc.innerHTML = '点击「下一步」开始动画演示。';
  progressEl.textContent = '0 / ' + steps.length;
  prevBtn.disabled = true;
  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', () => { if (currentStep < steps.length - 1) { currentStep++; applyStep(currentStep); } });
prevBtn.addEventListener('click', () => { if (currentStep > 0) { currentStep--; applyStep(currentStep); } });
resetBtn.addEventListener('click', reset);
reset();
</script>
</body>
</html>
